.pbtn{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:1rem .9rem;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .3s,box-shadow .3s;font:inherit}
